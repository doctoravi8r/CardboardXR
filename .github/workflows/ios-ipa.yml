# Builds an unsigned iOS .ipa when a version tag (v0.0.1) is pushed, uploads it as a workflow
# artifact, and attaches it to the tag's GitHub release. Unsigned: re-sign it with your own Apple ID
# to install (AltStore, Sideloadly, ...).
#
# One-time setup: repo Settings > Secrets and variables > Actions, add UNITY_LICENSE (the contents of
# a Unity .ulf), UNITY_EMAIL and UNITY_PASSWORD. See https://game.ci/docs/github/activation
#
# Third-party actions are pinned to full commit SHAs (the comment is the tag it was resolved from).
name: iOS IPA

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'App version for a manual build, e.g. 0.1.1 (blank = leave as in the project)'
        required: false
        default: ''

# Fork hardening: the token is read-only unless a job asks for more (only the release step does).
permissions:
  contents: read

# One build per ref at a time; a newer run replaces a queued/older one.
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity-export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # don't leave the token in .git/config for later steps
          fetch-depth: 0  # game-ci derives a version from history; avoids an unshallow fetch later

      # game-ci runs Unity in Docker and only passes its own env vars in, so write the version into
      # ProjectSettings directly. The checkout is thrown away after the run; the tag pattern above
      # guarantees three numbers.
      # Fork addition: a manual run can pass a version (validated; passed via env, never interpolated).
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION=${GITHUB_REF_NAME#v}; else VERSION=$INPUT_VERSION; fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.2.3"; exit 1; }
          sed -i -E "s/^( *)bundleVersion: .*/\1bundleVersion: $VERSION/" ProjectSettings/ProjectSettings.asset
          grep -q "^ *bundleVersion: $VERSION\$" ProjectSettings/ProjectSettings.asset || { echo "::error::bundleVersion not set"; exit 1; }
          # Fork addition: CFBundleVersion (build number) was left at 0; use the same version string.
          sed -i -E "s/^( *)iPhone: 0\$/\1iPhone: $VERSION/" ProjectSettings/ProjectSettings.asset
          grep -q "^ *iPhone: $VERSION\$" ProjectSettings/ProjectSettings.asset || { echo "::error::iOS build number not set"; exit 1; }

      # Fork addition: build under our own bundle id (an iOS bundle id belongs to the Apple team that
      # first signed it). Set repo variable IOS_BUNDLE_ID to override the default below. Edited in
      # ProjectSettings for the same reason as the version above: env vars don't reach the container.
      - name: Set bundle id
        env:
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.malekalali.cardboardxr' }}
        run: |
          sed -i -E "s/^( *)iPhone: com\.brenpoly\.cardboardxr\$/\1iPhone: $BUNDLE_ID/" ProjectSettings/ProjectSettings.asset
          grep -q "^ *iPhone: $BUNDLE_ID\$" ProjectSettings/ProjectSettings.asset || { echo "::error::bundle id not set"; exit 1; }
          echo "Bundle id: $BUNDLE_ID"

      - uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.6.8f1
          targetPlatform: iOS
          buildMethod: ProjectBootstrap.StereoBuilder.BuildIos
          allowDirtyBuild: true

      # A build without ARKit still compiles and runs, just with no AR, so fail loudly here.
      - name: Check ARKit is in the Xcode project
        run: |
          count=$(grep -c libUnityARKit Builds/iOS/Unity-iPhone.xcodeproj/project.pbxproj || true)
          echo "libUnityARKit references: $count"
          test "$count" -gt 0 || { echo "::error::ARKit missing from the Xcode project"; exit 1; }

      # The Xcode project is written to Builds/iOS (see StereoBuilder.XcodeProject).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xcode-project
          path: Builds/iOS
          if-no-files-found: error
          retention-days: 3  # intermediate only; public-repo artifacts are visible to signed-in users

  ipa:
    needs: unity-export
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write  # needed to add the .ipa to the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: xcode-project
          path: Builds/iOS

      - name: Build unsigned archive
        run: |
          xcodebuild -project Builds/iOS/Unity-iPhone.xcodeproj -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos -archivePath build/CardboardXR.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -30

      # Fork addition (v0.1.1). Unity 6.6 embeds a prebuilt stub, UnityRuntime.framework, that Unity
      # signed with its macOS "Developer ID Application" certificate (detached files in _CodeSignature)
      # and that has a build-machine temp path as its install name. A normal Xcode signing pass would
      # overwrite that signature, but this archive is built with signing off, so it reached the IPA
      # as-is and iOS rejected it at install (ApplicationVerificationFailed 0xe8008001). Hand every
      # embedded framework/dylib to the re-signer (Sideloadly etc.) in the same state as the app
      # binary and UnityFramework: one arm64 slice, no signature, no _CodeSignature, sane metadata.
      - name: Sanitize embedded frameworks
        run: |
          set -euo pipefail
          APP=$(ls -d build/CardboardXR.xcarchive/Products/Applications/*.app)
          xattr -cr "$APP"
          find "$APP" -name .DS_Store -delete
          shopt -s nullglob
          for FW in "$APP"/Frameworks/*.framework; do
            NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$FW/Info.plist")
            BIN="$FW/$NAME"
            echo "== $(basename "$FW") ($NAME)"
            rm -rf "$FW/_CodeSignature"
            if [[ "$(lipo -info "$BIN")" == Architectures\ in\ the\ fat\ file* ]]; then
              lipo "$BIN" -thin arm64 -output "$BIN.thin" && mv "$BIN.thin" "$BIN"
              echo "   thinned fat binary to arm64"
            fi
            codesign --remove-signature "$BIN" 2>/dev/null || true
            WANT="@rpath/$(basename "$FW")/$NAME"
            HAVE=$(otool -D "$BIN" | tail -n +2)
            if [ "$HAVE" != "$WANT" ]; then
              install_name_tool -id "$WANT" "$BIN"
              echo "   install name: $HAVE -> $WANT"
            fi
            PL="$FW/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms' "$PL" >/dev/null 2>&1 \
              || /usr/libexec/PlistBuddy -c 'Add :CFBundleSupportedPlatforms array' -c 'Add :CFBundleSupportedPlatforms:0 string iPhoneOS' "$PL"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleInfoDictionaryVersion' "$PL" >/dev/null 2>&1 \
              || /usr/libexec/PlistBuddy -c 'Add :CFBundleInfoDictionaryVersion string 6.0' "$PL"
            plutil -convert binary1 "$PL"
          done
          for D in "$APP"/Frameworks/*.dylib; do
            codesign --remove-signature "$D" 2>/dev/null || true
          done

      # Fail the build if anything is still pre-signed or a framework is malformed.
      - name: Verify app bundle
        run: |
          set -euo pipefail
          APP=$(ls -d build/CardboardXR.xcarchive/Products/Applications/*.app)
          LEFT=$(find "$APP" -name _CodeSignature -o -name embedded.mobileprovision)
          [ -z "$LEFT" ] || { echo "::error::leftover signing files: $LEFT"; exit 1; }
          bad=0
          while IFS= read -r -d '' F; do
            if [[ "$(file -b "$F")" == *Mach-O* ]]; then
              info=$(lipo -info "$F")
              if codesign -d "$F" >/dev/null 2>&1; then echo "::error::still signed: $F"; bad=1; fi
              [[ "$info" == *arm64* ]] || { echo "::error::no arm64 slice: $F"; bad=1; }
              echo "OK  ${F#$APP/}  [$info]"
            fi
          done < <(find "$APP" -type f -perm -u+x -print0)
          for FW in "$APP"/Frameworks/*.framework; do
            NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$FW/Info.plist")
            ID=$(otool -D "$FW/$NAME" | tail -n +2)
            [ "$ID" = "@rpath/$(basename "$FW")/$NAME" ] || { echo "::error::bad install name $ID"; bad=1; }
          done
          exit $bad

      - name: Package .ipa
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          LABEL=$GITHUB_REF_NAME
          if [ "$GITHUB_REF_TYPE" != tag ] && [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then LABEL=v$INPUT_VERSION; fi
          mkdir -p Payload
          cp -R build/CardboardXR.xcarchive/Products/Applications/*.app Payload/
          zip -qry "CardboardXR-$LABEL.ipa" Payload
          shasum -a 256 "CardboardXR-$LABEL.ipa"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CardboardXR-ipa
          path: '*.ipa'
          if-no-files-found: error

      # Adds the .ipa to the tag's release, creating it if missing. No body or generate_release_notes
      # is passed, so notes on a release made by hand (with the APK) are left alone.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: '*.ipa'
